<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="326" viewBox="0 0 1280 326" role="img" aria-labelledby="title desc">
<title id="title">Wachwerk begleitet Abend, Morgen und Tag</title>
<desc id="desc">Abends helfen Erinnerungen und Schlafplanung. Morgens folgen Wecker, Aufwachaufgabe und Handy-Pause. Tagsüber helfen Fokus, App-Limits und tägliche Gewohnheiten.</desc>
<rect width="1280" height="326" rx="28" fill="#091a29"/>
<g font-family="Segoe UI,Arial,sans-serif">
<g transform="translate(24 24)">
<rect width="390" height="278" rx="24" fill="#142b40"/>
<text x="28" y="43" fill="#9eb6d4" font-size="14" letter-spacing="2" font-weight="700">01 / ABEND</text>
<path d="M326 30a25 25 0 1 0 23 35 27 27 0 0 1-23-35" fill="#c9dcf8"/>
<text x="28" y="103" fill="#edf3ff" font-size="33" font-weight="700">Runterkommen.</text>
<text x="28" y="151" fill="#b3c5d8" font-size="20">Handy weglegen</text>
<text x="28" y="183" fill="#b3c5d8" font-size="20">Schlafenszeit planen</text>
<rect x="28" y="214" width="226" height="36" rx="18" fill="#233e57"/>
<text x="141" y="238" fill="#c9dcf8" font-size="15" text-anchor="middle">Erinnerungen + Schnellplaner</text>
</g>
<g transform="translate(445 24)">
<rect width="390" height="278" rx="24" fill="#13342d"/>
<text x="28" y="43" fill="#99cbb7" font-size="14" letter-spacing="2" font-weight="700">02 / MORGEN</text>
<circle cx="337" cy="51" r="16" fill="#ffd347"/>
<path d="M337 25v-6M337 77v6M311 51h-6M363 51h6M318 32l-4-4M356 70l4 4M356 32l4-4M318 70l-4 4" stroke="#ffd347" stroke-width="3" stroke-linecap="round"/>
<text x="28" y="103" fill="#edf3ff" font-size="33" font-weight="700">Wirklich aufstehen.</text>
<text x="28" y="151" fill="#b3d2c5" font-size="20">Aufwachaufgabe schaffen</text>
<text x="28" y="183" fill="#b3d2c5" font-size="20">Den ersten Feed aufschieben</text>
<rect x="28" y="214" width="210" height="36" rx="18" fill="#214a3a"/>
<text x="133" y="238" fill="#9bf5b1" font-size="15" text-anchor="middle">Wecker + Morgensperre</text>
</g>
<g transform="translate(866 24)">
<rect width="390" height="278" rx="24" fill="#332c20"/>
<text x="28" y="43" fill="#d2bd95" font-size="14" letter-spacing="2" font-weight="700">03 / TAG</text>
<circle cx="337" cy="51" r="27" fill="none" stroke="#6a5c40" stroke-width="6"/>
<path d="M337 24a27 27 0 1 1-25 37" fill="none" stroke="#ffd347" stroke-width="6" stroke-linecap="round"/>
<text x="28" y="103" fill="#edf3ff" font-size="33" font-weight="700">Dranbleiben.</text>
<text x="28" y="151" fill="#d5c7ad" font-size="20">Zeit bewusst nutzen</text>
<text x="28" y="183" fill="#d5c7ad" font-size="20">Kleine Erfolge festhalten</text>
<rect x="28" y="214" width="216" height="36" rx="18" fill="#4b4028"/>
<text x="136" y="238" fill="#ffd347" font-size="15" text-anchor="middle">Fokus + Limits + Habits</text>
